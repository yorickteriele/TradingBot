events {
    worker_connections 1024;
}

http {
    upstream dashboard {
        server dashboard:8501;
    }

    # HTTP server for ACME challenge and redirect to HTTPS
    server {
        listen 80;
        server_name trading.yorickteriele.nl www.trading.yorickteriele.nl;
        
        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
        
        # For Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name trading.yorickteriele.nl www.trading.yorickteriele.nl;
        
        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/trading.yorickteriele.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trading.yorickteriele.nl/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Proxy configuration
        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        
        # Additional security settings
        client_max_body_size 10M;
        keepalive_timeout 70;
    }
}
