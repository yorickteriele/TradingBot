version: '3.8'

services:
  # Trading Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tradingbot-bot
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-tradingbot}
      - DB_PORT=${DB_PORT:-5432}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradingbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; psycopg2.connect(host='${DB_HOST:-host.docker.internal}', dbname='${DB_NAME:-tradingbot}', user='${DB_USER:-postgres}', password='${DB_PASSWORD}')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  db:
    image: postgres
    container_name: tradingbot-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-tradingbot}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradingbot-network
    restart: unless-stopped

  # Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        - GIT_REPO=https://github.com/yourusername/tradingbot.git
        - GIT_BRANCH=main
    container_name: tradingbot-dashboard
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tradingbot}
      - DB_PORT=${DB_PORT:-5432}
    ports:
      - "8502:8501"
    networks:
      - tradingbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tradingbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - tradingbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tradingbot-network:
    driver: bridge

volumes:
  certbot-etc:
  certbot-www:

extra_hosts:
  - "host.docker.internal:host-gateway"
