version: '3.8'

services:
  # Trading Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tradingbot-bot
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-tradingbot}
      - DB_PORT=5432
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradingbot-network
    restart: unless-stopped
    volumes:
      - ./data/bot:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; psycopg2.connect(host='db', dbname='${DB_NAME:-tradingbot}', user='${DB_USER:-postgres}', password='${DB_PASSWORD}')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Database
  db:
    image: postgres:15-alpine
    container_name: tradingbot-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-tradingbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tradingbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tradingbot-network
    restart: unless-stopped

networks:
  tradingbot-network:
    driver: bridge

volumes:
  postgres_data:
