name: Deploy Trading Bot

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build:
    name: Build and Prepare
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    # - name: Install dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install -r requirements.txt
        
    # - name: Run tests
    #   run: |
    #     python -m pytest
        
    - name: Create deployment package
      run: |
        mkdir -p deploy
        # Copy only necessary files
        cp -r trading_bot dashboard nginx docker-compose.yml Dockerfile.* *.sh deploy/
        # Create archive
        tar -czf tradingbot-deploy.tar.gz -C deploy .
        
    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: tradingbot-package
        path: tradingbot-deploy.tar.gz
        retention-days: 1
        
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    
    steps:
    - name: Download deployment package
      uses: actions/download-artifact@v4
      with:
        name: tradingbot-package
        
    - name: Setup SSH
      run: |    
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        
    - name: Download deployment package
      uses: actions/download-artifact@v4
      with:
        name: tradingbot-package
        
    - name: List downloaded files
      run: ls -la
      
    - name: Copy and extract deployment package
      run: |
        # First, copy the artifact to the server
        scp -o StrictHostKeyChecking=no tradingbot-deploy.tar.gz root@${{ secrets.SSH_HOST }}:/tmp/
        
        # Then set up the environment and extract
        ssh -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} '
          set -e
          
          # Create app directory
          mkdir -p /opt/tradingbot
          cd /opt/tradingbot
          
          # Clean up any existing files
          rm -rf *
          
          # Extract deployment package
          echo "Extracting deployment package..."
          ls -la /tmp/tradingbot-deploy.tar.gz
          tar -xzf /tmp/tradingbot-deploy.tar.gz -C /opt/tradingbot --strip-components=1
          rm -f /tmp/tradingbot-deploy.tar.gz
          
          # Set up environment variables
          echo "Setting up environment variables..."
          echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> .env
          echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}" >> .env
        '
    - name: Deploy application
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} '
          set -e
          cd /opt/tradingbot
          
          # Initialize or renew certificates if needed
          if [ ! -f "data/certbot/conf/live/trading.yorickteriele.nl/fullchain.pem" ]; then
            chmod +x init-letsencrypt.sh
            ./init-letsencrypt.sh
          else
            ./renew-certs.sh
          fi
          
          # Stop and remove existing containers
          docker-compose down
          
          # Pull latest images and build/start services
          docker-compose up -d --build --remove-orphans
          
          # Clean up unused resources
          docker system prune -f --volumes
          
          # Verify services
          if ! docker-compose ps | grep -q "Up"; then
            echo "Some services failed to start"
            docker-compose logs
            exit 1
          fi
          
          echo "All services are running"
        '
    - name: Cleanup
      if: always()
      run: |
        rm -f ~/.ssh/id_rsa
